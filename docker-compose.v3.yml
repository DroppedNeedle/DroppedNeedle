# DroppedNeedle v3 compose (stage-1 skeleton). One backend process only:
# never add replicas or a second backend service, because durable-operation
# ownership is in-process and breaks above one process.
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.v3
    image: droppedneedle-v3:stage1
    container_name: droppedneedle-v3
    ports:
      # Distinct host port on purpose: the v2 dev stack owns 8688 in places.
      - "${V3_PORT:-18688}:8688"
    environment:
      PORT: "8688"
      RUST_LOG: "${RUST_LOG:-info}"
    restart: unless-stopped
