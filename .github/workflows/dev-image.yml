name: Dev image

# Builds :dev from a commit on main once CI has passed on it, so a commit CI
# failed never reaches :dev. CI's path filters decide which pushes run it.
# The jobs check out and tag the commit CI ran on: on workflow_run,
# github.sha is main's newest commit, which can be a later one.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

# On workflow_run github.ref is always main, so only runs that will publish
# share the group, under the same condition as the build job. Any other run
# gets a group of its own and cannot cancel a build already underway.
concurrency:
  group: >-
    ${{ github.workflow }}-${{
    (github.event.workflow_run.conclusion == 'success'
    && github.event.workflow_run.event != 'pull_request'
    && github.event.workflow_run.head_repository.full_name == github.repository)
    && 'publish' || github.run_id }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build (${{ matrix.arch }})
    # Only a passing run of this repository's own main: a pull request's
    # run can carry a branch named main from a fork.
    if: >-
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event != 'pull_request'
      && github.event.workflow_run.head_repository.full_name == github.repository
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Get short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Get build date and commit
        id: date
        run: |
          echo "timestamp=$(git log -1 --pretty=%cI)" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Warm cache (${{ matrix.platform }})
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          build-args: |
            COMMIT_TAG=dev-${{ steps.sha.outputs.short }}
            BUILD_DATE=${{ steps.date.outputs.timestamp }}
            VCS_REF=${{ steps.date.outputs.revision }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
          provenance: false

  publish:
    name: Publish multi-arch image
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Get short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Get build date and commit
        id: date
        run: |
          echo "timestamp=$(git log -1 --pretty=%cI)" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set image tags
        env:
          SHORT_SHA: ${{ steps.sha.outputs.short }}
        run: |
          {
            echo "TAGS<<EOF"
            echo "ghcr.io/droppedneedle/droppedneedle:dev"
            echo "ghcr.io/droppedneedle/droppedneedle:dev-$SHORT_SHA"
            if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
              echo "droppedneedle/droppedneedle:dev"
              echo "droppedneedle/droppedneedle:dev-$SHORT_SHA"
            fi
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Build and push (multi-arch)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.TAGS }}
          build-args: |
            COMMIT_TAG=dev-${{ steps.sha.outputs.short }}
            BUILD_DATE=${{ steps.date.outputs.timestamp }}
            VCS_REF=${{ steps.date.outputs.revision }}
          cache-from: |
            type=gha,scope=linux/amd64
            type=gha,scope=linux/arm64
          provenance: false
