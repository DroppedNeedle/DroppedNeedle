name: CI

# Runs for pushes to any branch and for pull requests, so it keeps working
# when the release branch is renamed. Dependabot branches are covered by
# their pull request.
on:
  push:
    branches-ignore: ['dependabot/**']
    paths:
      - 'server/**'
      - 'frontend/**'
      - 'sdk/**'
      - 'examples/plugins/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'entrypoint.sh'
      - '.cargo/**'
      - 'rust-toolchain.toml'
      - '.github/node-version'
      - '.github/workflows/v3-ci.yml'
  pull_request:
    paths:
      - 'server/**'
      - 'frontend/**'
      - 'sdk/**'
      - 'examples/plugins/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'entrypoint.sh'
      - '.cargo/**'
      - 'rust-toolchain.toml'
      - '.github/node-version'
      - '.github/workflows/v3-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

# A run on main finishes, so a burst of pushes still ends in a full run;
# GitHub keeps only the newest waiting one. Other refs cancel the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Decides which jobs a change needs. A manual run needs all of them.
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.rust == 'true' }}
      contract: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.contract == 'true' }}
      image: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.image == 'true' }}
    steps:
      - name: Checkout code
        if: github.event_name != 'workflow_dispatch'
        uses: actions/checkout@v7

      - name: Filter paths
        id: filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@v4
        with:
          # Compare a push with the commit before it, not with the default
          # branch, which would report every file on a long-lived branch.
          base: ${{ github.ref }}
          filters: |
            rust:
              - 'server/**'
              - 'sdk/**'
              - 'frontend/src/lib/stores/customCssRules.json'
              - 'examples/plugins/**'
              - '.cargo/**'
              - 'rust-toolchain.toml'
              - '.github/workflows/v3-ci.yml'
            contract:
              - 'server/**'
              - 'sdk/**'
              - 'rust-toolchain.toml'
              - 'frontend/package.json'
              - 'frontend/src/lib/api/v3/openapi.d.ts'
              - '.github/node-version'
              - '.github/workflows/v3-ci.yml'
            image:
              - 'server/**'
              - 'frontend/**'
              - 'sdk/**'
              - 'Dockerfile'
              - '.dockerignore'
              - 'entrypoint.sh'
              - 'rust-toolchain.toml'
              - '.github/node-version'
              - '.github/workflows/v3-ci.yml'

  # Two shards that together run what `cargo test --workspace` runs: the two
  # longest test binaries, then every other test target, the unit tests and
  # the doc tests.
  test:
    name: Tests (${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ['library and server', 'other targets']
    defaults:
      run:
        working-directory: ./server
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # The version and components come from rust-toolchain.toml.
      - name: Install Rust toolchain
        run: rustup toolchain install

      # The shards share one cache and only one saves it. The other targets
      # shard saves, because its doc test run builds the kernel's dependencies
      # a second time, with the kernel's own features, on top of the set both
      # shards build.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
          shared-key: test
          save-if: ${{ github.event_name != 'pull_request' && matrix.shard == 'other targets' }}

      - name: Run the library and server tests
        if: matrix.shard == 'library and server'
        run: cargo test --workspace --test library --test server

      # Every test target but those two, and the libraries with doc tests on,
      # are read from the manifests, so a new one runs without an edit here.
      # Cargo refuses --doc beside other target options, and with --workspace
      # it would also run the libraries that turn doc tests off, so the doc
      # tests are a run of their own over those packages.
      - name: Run every other test target
        if: matrix.shard == 'other targets'
        shell: bash
        run: |
          meta=$(cargo metadata --format-version 1 --no-deps)
          tests=$(jq -r '.packages[].targets[] | select(.kind == ["test"] and .test) | .name
                         | select(. != "library" and . != "server") | "--test=" + .' <<< "$meta" \
            | sort -u)
          docs=$(jq -r '.packages[] | select(any(.targets[]; any(.kind[]; . == "lib") and .doctest))
                        | "--package=" + .name' <<< "$meta" \
            | sort -u)
          if [ -z "$tests" ]; then
            echo "::error::The manifests list no test targets besides library and server."
            exit 1
          fi
          if [ -z "$docs" ]; then
            echo "::error::The manifests list no library with doc tests turned on."
            exit 1
          fi
          mapfile -t others <<< "$tests"
          mapfile -t doc_packages <<< "$docs"
          cargo test --workspace --lib --bins "${others[@]}"
          cargo test "${doc_packages[@]}" --doc

  clippy:
    name: Clippy
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: ./server
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
          save-if: ${{ github.event_name != 'pull_request' }}

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The test targets turn on the test-support feature for the whole
      # crate. This lints the library and binaries as they ship, without it.
      - name: Run Clippy on the shipping build
        run: cargo clippy --workspace --lib --bins -- -D warnings

  fmt:
    name: Format
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ./server
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Check formatting
        run: cargo fmt --check

      - name: Refuse file changes in the library outside the publisher
        run: ./scripts/library-file-gate.sh

      - name: Refuse public items nothing references
        run: python3 -I scripts/dead-code-scan.py .

  audit:
    name: Audit
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./server
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Run audit
        run: cargo audit

  licenses:
    name: Licenses
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./server
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Check licenses
        run: cargo deny check

  ts-diff:
    name: Contract diff
    needs: changes
    if: needs.changes.outputs.contract == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
          save-if: ${{ github.event_name != 'pull_request' }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          # The pinned pnpm version is declared in the frontend package.
          package_json_file: frontend/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .github/node-version

      - name: Install the type generator
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Check contract drift
        run: ./server/openapi/check.sh

  container-e2e:
    name: Container E2E
    needs: changes
    if: needs.changes.outputs.image == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Base images and rust-version match the pinned versions
        run: |
          node_version=$(cat .github/node-version)
          rust_version=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          grep -q "^FROM node:${node_version}-bookworm-slim " Dockerfile
          grep -q "^FROM rust:${rust_version}-bookworm " Dockerfile
          grep -q "^FROM rust:${rust_version}-bookworm " server/scripts/e2e-mocks.Dockerfile
          grep -qxF "rust-version = \"${rust_version%.*}\"" server/Cargo.toml
          grep -qxF "rust-version = \"${rust_version%.*}\"" server/testkit/Cargo.toml

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Each image keeps its layers in its own cache scope, so a source-only
      # change rebuilds only our crates. This image is built with the
      # quicker ci-e2e profile; the release workflow boots the shipping
      # build before it publishes.
      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: droppedneedle-v3:e2e
          build-args: |
            CARGO_PROFILE=ci-e2e
          cache-from: type=gha,scope=e2e
          cache-to: type=gha,mode=max,scope=e2e
          provenance: false

      - name: Build the mocks image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: server/scripts/e2e-mocks.Dockerfile
          load: true
          tags: droppedneedle-v3:e2e-mocks
          cache-from: type=gha,scope=e2e-mocks
          cache-to: type=gha,mode=max,scope=e2e-mocks
          provenance: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          # The pinned pnpm version is declared in the frontend package.
          package_json_file: frontend/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .github/node-version
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: pnpm install --frozen-lockfile

      - name: Install Playwright chromium
        working-directory: ./frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Boot, probe, stop, then the browser journeys
        env:
          DN_E2E_IMAGE: droppedneedle-v3:e2e
          DN_E2E_MOCKS_IMAGE: droppedneedle-v3:e2e-mocks
        run: ./server/scripts/e2e-container.sh

      - name: Upload journey traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: journey-traces
          path: frontend/test-results/journeys/
          if-no-files-found: ignore
          retention-days: 7
