name: v3 CI

# Runs for pushes to any branch and for pull requests, so it keeps working
# when the release branch is renamed. Dependabot branches are covered by
# their pull request.
on:
  push:
    branches-ignore: ['dependabot/**']
    paths:
      - 'server/**'
      - 'frontend/**'
      - 'sdk/**'
      - 'examples/plugins/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'entrypoint.sh'
      - 'rust-toolchain.toml'
      - '.github/node-version'
      - '.github/workflows/v3-ci.yml'
  pull_request:
    paths:
      - 'server/**'
      - 'frontend/**'
      - 'sdk/**'
      - 'examples/plugins/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'entrypoint.sh'
      - 'rust-toolchain.toml'
      - '.github/node-version'
      - '.github/workflows/v3-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides which jobs a change needs. A manual run needs all of them.
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.rust == 'true' }}
      contract: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.contract == 'true' }}
      image: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.image == 'true' }}
    steps:
      - name: Checkout code
        if: github.event_name != 'workflow_dispatch'
        uses: actions/checkout@v7

      - name: Filter paths
        id: filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@v4
        with:
          # Compare a push with the commit before it, not with the default
          # branch, which would report every file on a long-lived branch.
          base: ${{ github.ref }}
          filters: |
            rust:
              - 'server/**'
              - 'sdk/**'
              - 'examples/plugins/**'
              - 'rust-toolchain.toml'
              - '.github/workflows/v3-ci.yml'
            contract:
              - 'server/**'
              - 'sdk/**'
              - 'rust-toolchain.toml'
              - 'frontend/package.json'
              - 'frontend/src/lib/api/v3/openapi.d.ts'
              - '.github/node-version'
              - '.github/workflows/v3-ci.yml'
            image:
              - 'server/**'
              - 'frontend/**'
              - 'sdk/**'
              - 'Dockerfile'
              - '.dockerignore'
              - 'entrypoint.sh'
              - 'rust-toolchain.toml'
              - '.github/workflows/v3-ci.yml'

  test:
    name: Tests
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ./server
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # The version and components come from rust-toolchain.toml.
      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
          save-if: ${{ github.event_name != 'pull_request' }}

      - name: Run tests
        run: cargo test --workspace

  clippy:
    name: Clippy
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./server
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
          save-if: ${{ github.event_name != 'pull_request' }}

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The test targets turn on the test-support feature for the whole
      # crate. This lints the library and binaries as they ship, without it.
      - name: Run Clippy on the shipping build
        run: cargo clippy --workspace --lib --bins -- -D warnings

  fmt:
    name: Format
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ./server
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Check formatting
        run: cargo fmt --check

      - name: Refuse file changes in the library outside the publisher
        run: ./scripts/library-file-gate.sh

  audit:
    name: Audit
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./server
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Run audit
        # RUSTSEC-2023-0071 (rsa Marvin, no fixed upgrade) is lockfile-only
        # via sqlx-mysql, which is not in the build graph (sqlite only);
        # the code never compiles. Re-check if another sqlx driver lands.
        run: cargo audit --ignore RUSTSEC-2023-0071

  licenses:
    name: Licenses
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./server
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Check licenses
        run: cargo deny check

  ts-diff:
    name: Contract diff
    needs: changes
    if: needs.changes.outputs.contract == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
          save-if: ${{ github.event_name != 'pull_request' }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          # The pinned pnpm version is declared in the frontend package.
          package_json_file: frontend/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .github/node-version

      - name: Install the type generator
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Check contract drift
        run: ./server/openapi/check.sh

  container-e2e:
    name: Container E2E
    needs: changes
    if: needs.changes.outputs.image == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          # The pinned pnpm version is declared in the frontend package.
          package_json_file: frontend/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .github/node-version
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: pnpm install --frozen-lockfile

      - name: Install Playwright chromium
        working-directory: ./frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Boot, probe, stop, then the browser journeys
        run: ./server/scripts/e2e-container.sh

      - name: Upload journey traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: journey-traces
          path: frontend/test-results/journeys/
          if-no-files-found: ignore
          retention-days: 7
