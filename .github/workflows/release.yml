name: Release

# Publishes droppedneedle/droppedneedle from a version tag, and attaches the
# Linux binaries and the web UI to the tag's GitHub release for people who run
# DroppedNeedle without Docker. A tag push publishes only after every check
# below passes and a reviewer approves the `release` environment. A manual
# run is a dry run unless it is started on the tag itself with `push` ticked;
# a dry run still keeps the release files as a workflow artifact.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, for example v3.0.0 or v3.1.0-rc.1
        required: true
        type: string
      push:
        description: Publish the image. Only works when run on the tag itself.
        type: boolean
        default: false
      skip_ci:
        description: Publish even though CI has not passed on the commit. The approval is still needed.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # The branch releases are cut from. Set the repository variable when the
  # branch is renamed.
  RELEASE_BRANCH: ${{ vars.RELEASE_BRANCH || 'main' }}

jobs:
  checks:
    name: Release checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      publish: ${{ steps.version.outputs.publish }}
      latest: ${{ steps.latest.outputs.latest }}
      beta: ${{ steps.beta.outputs.beta }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check the version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PUSH: ${{ inputs.push }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            version="$GITHUB_REF_NAME"
            publish=true
          else
            version="$INPUT_VERSION"
            publish="$INPUT_PUSH"
          fi

          core='(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)'
          suffix='(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?'
          if [[ ! "$version" =~ ^v${core}${suffix}$ ]]; then
            echo "::error::'$version' is not a version tag (v1.2.3 or v1.2.3-rc.1)."
            exit 1
          fi

          if [[ "$publish" == "true" && "$GITHUB_REF" != "refs/tags/$version" ]]; then
            echo "::error::Publishing needs a run on the tag $version, not on $GITHUB_REF."
            exit 1
          fi

          if [[ "$version" == *-* ]]; then prerelease=true; else prerelease=false; fi
          {
            echo "version=$version"
            echo "prerelease=$prerelease"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"

      # The server gives the crate version to plugins and in its user agent,
      # so it has to agree with the tag the image is published under. A
      # pre-release carries the version it leads up to (v3.0.0-beta.1 needs
      # 3.0.0), so the user agent MetaBrainz's gateway was set up for stays
      # the same through a release's betas.
      - name: Check the version matches the crate
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          crate="$(awk '
            /^\[/ { in_package = ($0 == "[workspace.package]") }
            in_package && /^version[[:space:]]*=/ {
              gsub(/^[^"]*"|".*$/, "")
              print
              exit
            }' server/Cargo.toml)"
          if [[ -z "$crate" ]]; then
            echo "::error::No package version found in server/Cargo.toml."
            exit 1
          fi
          if [[ "v$crate" != "${VERSION%%-*}" ]]; then
            echo "::error::$VERSION does not match version $crate in server/Cargo.toml. Bump the crate version before tagging."
            exit 1
          fi

      # latest only moves forward: a pre-release never moves it, and neither
      # does a patch to an older line. The full versions already tagged in
      # the repository count as released.
      - name: Decide whether latest moves
        id: latest
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          highest="$(git tag --list 'v*' \
            | awk -v self="$VERSION" '$0 != self && /^v[0-9]+\.[0-9]+\.[0-9]+$/' \
            | sort -V | tail -n 1)"

          latest=false
          if [[ "$PRERELEASE" == "true" ]]; then
            echo "$VERSION is a pre-release and leaves latest alone."
          elif [[ "$(printf '%s\n' "$highest" "$VERSION" | sort -V | tail -n 1)" == "$VERSION" ]]; then
            latest=true
            echo "$VERSION is newer than ${highest:-every other release} and moves latest."
          else
            echo "$VERSION is older than $highest and leaves latest alone."
          fi
          echo "latest=$latest" >> "$GITHUB_OUTPUT"

      # beta follows the newest pre-release, so testers can stay on one tag.
      # A full release leaves it alone, and so does an older pre-release.
      - name: Decide whether beta moves
        id: beta
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          beta=false
          if [[ "$PRERELEASE" != "true" ]]; then
            echo "$VERSION is a full release and leaves beta alone."
          else
            highest="$(git tag --list 'v*-*' \
              | awk -v self="$VERSION" '$0 != self' \
              | sort -V | tail -n 1)"
            if [[ "$(printf '%s\n' "$highest" "$VERSION" | sort -V | tail -n 1)" == "$VERSION" ]]; then
              beta=true
              echo "$VERSION is the newest pre-release and moves beta."
            else
              echo "$VERSION is older than $highest and leaves beta alone."
            fi
          fi
          echo "beta=$beta" >> "$GITHUB_OUTPUT"

      - name: Check the commit is on the release branch
        run: |
          if ! git rev-parse --verify --quiet "origin/$RELEASE_BRANCH" > /dev/null; then
            echo "::error::Release branch '$RELEASE_BRANCH' does not exist."
            exit 1
          fi
          if ! git merge-base --is-ancestor "HEAD^{commit}" "origin/$RELEASE_BRANCH"; then
            echo "::error::$(git rev-parse HEAD) is not on '$RELEASE_BRANCH'."
            exit 1
          fi

      # CI is path-filtered, so a commit that changed no code has no CI
      # run. Start CI by hand on the release branch for such a commit, or
      # run this workflow by hand with skip_ci ticked.
      - name: Check CI passed on the commit
        if: ${{ !inputs.skip_ci }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="$(git rev-parse 'HEAD^{commit}')"
          runs="$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$sha&per_page=100" \
            --jq '.workflow_runs[] | [.path, .run_number, .status, (.conclusion // "none")] | @tsv')"

          latest() {
            awk -F'\t' -v path="$1" \
              '$1 == path && $2 > n { n = $2; state = $3 " " $4 } END { print state }' \
              <<< "$runs"
          }

          v3="$(latest .github/workflows/v3-ci.yml)"
          if [[ "$v3" != "completed success" ]]; then
            echo "::error::CI has not passed on $sha (latest run: ${v3:-none})."
            exit 1
          fi

          frontend="$(latest .github/workflows/frontend-ci.yml)"
          if [[ -n "$frontend" && "$frontend" != "completed success" ]]; then
            echo "::error::Frontend CI has not passed on $sha (latest run: $frontend)."
            exit 1
          fi

      - name: Note the skipped CI check
        if: ${{ inputs.skip_ci }}
        run: echo "::warning::The CI check was skipped for this run."

      # A job that names a missing environment creates it with no rules, so
      # the approval gate is checked before any job uses it.
      - name: Check the release environment needs approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rules="$(gh api "repos/$GITHUB_REPOSITORY/environments/release" \
            --jq '[.protection_rules[].type] | join(" ")')" || rules=""
          if [[ " $rules " != *" required_reviewers "* ]]; then
            echo "::error::The 'release' environment is missing or has no required reviewers."
            exit 1
          fi

  build:
    name: Build (${{ matrix.arch }})
    needs: checks
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            arch: amd64
            triple: x86_64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
            triple: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Get build date and commit
        id: date
        run: |
          echo "timestamp=$(git log -1 --pretty=%cI)" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Each architecture builds on its own native runner. The image leaves
      # the job as an OCI archive, which publish pushes once the release is
      # approved, so nothing reaches a registry before then and nothing is
      # built under emulation.
      - name: Build the image (${{ matrix.platform }})
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=oci,dest=image-${{ matrix.arch }}.tar
          build-args: |
            COMMIT_TAG=${{ needs.checks.outputs.version }}
            BUILD_DATE=${{ steps.date.outputs.timestamp }}
            VCS_REF=${{ steps.date.outputs.revision }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
          provenance: false

      # CI boots a quicker build of the same code on every push. Before
      # anything is published, the amd64 image built above goes through the
      # same boot test and journeys, dry runs included.
      - name: Load the image for the boot test
        if: matrix.arch == 'amd64'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: droppedneedle-v3:release-e2e
          build-args: |
            COMMIT_TAG=${{ needs.checks.outputs.version }}
            BUILD_DATE=${{ steps.date.outputs.timestamp }}
            VCS_REF=${{ steps.date.outputs.revision }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          provenance: false

      - name: Build the mocks image
        if: matrix.arch == 'amd64'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: server/scripts/e2e-mocks.Dockerfile
          load: true
          tags: droppedneedle-v3:e2e-mocks
          cache-from: type=gha,scope=e2e-mocks
          provenance: false

      - name: Setup pnpm
        if: matrix.arch == 'amd64'
        uses: pnpm/action-setup@v6
        with:
          # The pinned pnpm version is declared in the frontend package.
          package_json_file: frontend/package.json

      - name: Setup Node.js
        if: matrix.arch == 'amd64'
        uses: actions/setup-node@v7
        with:
          node-version-file: .github/node-version
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        if: matrix.arch == 'amd64'
        working-directory: ./frontend
        run: pnpm install --frozen-lockfile

      - name: Install Playwright chromium
        if: matrix.arch == 'amd64'
        working-directory: ./frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Boot, probe, stop, then the browser journeys
        if: matrix.arch == 'amd64'
        env:
          DN_E2E_IMAGE: droppedneedle-v3:release-e2e
          DN_E2E_MOCKS_IMAGE: droppedneedle-v3:e2e-mocks
        run: ./server/scripts/e2e-container.sh

      - name: Upload journey traces
        if: failure() && matrix.arch == 'amd64'
        uses: actions/upload-artifact@v7
        with:
          name: journey-traces
          path: frontend/test-results/journeys/
          if-no-files-found: ignore
          retention-days: 7

      # The same build cut at the release-files stage, so every layer comes
      # from the cache the step above filled and the binaries are the ones
      # the image ships. They are built on Debian 12, so they need glibc 2.36
      # or newer.
      - name: Export the release files
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          target: release-files
          outputs: type=local,dest=release-files
          cache-from: type=gha,scope=${{ matrix.platform }}
          provenance: false

      # The names are what install scripts download, so they stay as they
      # are. The web UI is the same on both, so only amd64 packs it.
      - name: Pack the release files
        env:
          VERSION: ${{ needs.checks.outputs.version }}
          ARCH: ${{ matrix.arch }}
          TRIPLE: ${{ matrix.triple }}
        run: |
          chmod 0755 release-files/server/droppedneedle release-files/server/droppedneedle-tool
          release-files/server/droppedneedle --print-openapi > /dev/null
          release-files/server/droppedneedle-tool --help > /dev/null
          ./server/scripts/size-budget.sh release-files

          # Fixed order, owner and times, so a re-run packs the same bytes and
          # the checksums of a release never change.
          pack() {
            tar --sort=name --mtime="@$(git log -1 --format=%ct)" \
              --owner=0 --group=0 --numeric-owner -cf - "$1" | gzip -n > "assets/$1.tar.gz"
          }
          mkdir assets
          server="droppedneedle-${VERSION}-${TRIPLE}-linux"
          mv release-files/server "$server"
          pack "$server"
          if [[ "$ARCH" == "amd64" ]]; then
            web="droppedneedle-frontend-${VERSION}"
            mv release-files/web-ui "$web"
            pack "$web"
          fi
          ls -l assets

      - name: Keep the release files
        uses: actions/upload-artifact@v7
        with:
          name: release-files-${{ matrix.arch }}
          path: assets/
          if-no-files-found: error
          retention-days: 7

      # The layers are compressed already, so the archive is stored as it is.
      - name: Keep the image
        uses: actions/upload-artifact@v7
        with:
          name: image-${{ matrix.arch }}
          path: image-${{ matrix.arch }}.tar
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  # Builds nothing: it pushes the two images the build jobs made and joins
  # them into one multi-arch image. A dry run joins them without pushing.
  publish:
    name: Publish multi-arch image
    needs: [checks, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.checks.outputs.version }}
      PUBLISH: ${{ needs.checks.outputs.publish }}
    steps:
      # The version tested to read oci-layout sources in imagetools create.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          version: v0.39.1

      - name: Log in to ghcr.io
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Fetch the images
        uses: actions/download-artifact@v8
        with:
          pattern: image-*
          path: images
          merge-multiple: true

      - name: Push and join the multi-arch image
        run: |
          sources=()
          for arch in amd64 arm64; do
            mkdir "images/$arch"
            tar -xf "images/image-$arch.tar" -C "images/$arch"
            digest="$(jq -r --arg arch "$arch" \
              '.manifests[] | select(.platform.architecture == $arch) | .digest' \
              "images/$arch/index.json")"
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::No $arch image in the $arch archive."
              exit 1
            fi
            sources+=("oci-layout://$PWD/images/$arch@$digest")
          done

          dry_run=()
          if [[ "$PUBLISH" != "true" ]]; then
            dry_run=(--dry-run)
          fi
          docker buildx imagetools create "${dry_run[@]}" \
            -t "ghcr.io/droppedneedle/droppedneedle:${VERSION}" \
            -t "droppedneedle/droppedneedle:${VERSION}" \
            "${sources[@]}"

      - name: Tag latest
        if: env.PUBLISH == 'true' && needs.checks.outputs.latest == 'true'
        run: |
          docker buildx imagetools create \
            -t "ghcr.io/droppedneedle/droppedneedle:latest" \
            -t "droppedneedle/droppedneedle:latest" \
            "droppedneedle/droppedneedle:${VERSION}"

      - name: Tag beta
        if: env.PUBLISH == 'true' && needs.checks.outputs.beta == 'true'
        run: |
          docker buildx imagetools create \
            -t "ghcr.io/droppedneedle/droppedneedle:beta" \
            -t "droppedneedle/droppedneedle:beta" \
            "droppedneedle/droppedneedle:${VERSION}"

  # Runs once the image is published, so the files only appear on a release
  # the reviewer approved, up to an hour after the release itself. SHA256SUMS
  # goes up last, so its presence means the set is complete. GitHub's Releases
  # page makes the release with the tag; for a tag pushed on its own, make the
  # release, then re-run this job within the 7 days the artifacts are kept.
  attach:
    name: Attach the release files
    needs: [checks, publish]
    if: needs.checks.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.checks.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Fetch the release files
        uses: actions/download-artifact@v8
        with:
          pattern: release-files-*
          path: assets
          merge-multiple: true

      - name: Attach them to the release
        working-directory: assets
        run: |
          if ! gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null; then
            echo "::error::There is no GitHub release for $VERSION. Make it on the Releases page, then re-run this job within 7 days."
            exit 1
          fi
          sha256sum -- *.tar.gz > SHA256SUMS
          cat SHA256SUMS
          gh release upload "$VERSION" --repo "$GITHUB_REPOSITORY" --clobber -- *.tar.gz
          gh release upload "$VERSION" --repo "$GITHUB_REPOSITORY" --clobber -- SHA256SUMS
