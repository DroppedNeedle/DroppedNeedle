name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'

permissions:
  contents: read

defaults:
  run:
    working-directory: ./frontend

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, Format & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          # defaults.run.working-directory only affects run steps, so the
          # action would look for packageManager in the root package.json.
          # Point it at the file that declares the pinned pnpm version.
          package_json_file: frontend/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '25'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm run lint

      - name: Run Prettier
        run: pnpm run format:check

      - name: Run type check
        run: pnpm run check

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          # defaults.run.working-directory only affects run steps, so the
          # action would look for packageManager in the root package.json.
          # Point it at the file that declares the pinned pnpm version.
          package_json_file: frontend/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '25'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests (server project)
        run: pnpm exec vitest run --project server

      - name: Install Playwright chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run component tests (client project)
        run: pnpm exec vitest run --project client
