[package]
name = "droppedneedle-tool"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "DroppedNeedle offline tool: upgrade, export, import, restore and recovery"
publish = false

[dependencies]
droppedneedle = { path = "..", version = "3.0.0" }
droppedneedle-auth.workspace = true
droppedneedle-kernel.workspace = true
droppedneedle-library.workspace = true
aes.workspace = true
argon2.workspace = true
base64.workspace = true
bcrypt.workspace = true
cbc.workspace = true
chacha20poly1305.workspace = true
getrandom.workspace = true
hmac.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
uuid.workspace = true

[features]
# The scratch v2 fixture for the test suites above.
test-support = [
    "droppedneedle/test-support",
    "droppedneedle-kernel/test-support",
    "droppedneedle-auth/test-support",
    "droppedneedle-library/test-support",
]

[dev-dependencies]
droppedneedle-tool = { path = ".", features = ["test-support"] }
droppedneedle-kernel = { workspace = true, features = ["test-support"] }
droppedneedle-acquire.workspace = true
droppedneedle-catalog.workspace = true
droppedneedle-compat.workspace = true
droppedneedle-media.workspace = true
droppedneedle-plugins.workspace = true
droppedneedle-providers.workspace = true
droppedneedle-testkit = { path = "../testkit", version = "0.1.0" }
axum.workspace = true
regex.workspace = true
tower.workspace = true
tracing-subscriber.workspace = true
utoipa.workspace = true
