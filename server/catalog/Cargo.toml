[package]
name = "droppedneedle-catalog"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "DroppedNeedle read side: catalog, discover, collections and concerts"
publish = false

[dependencies]
droppedneedle-auth.workspace = true
droppedneedle-kernel.workspace = true
droppedneedle-library.workspace = true
droppedneedle-media.workspace = true
droppedneedle-plugins.workspace = true
droppedneedle-providers.workspace = true
axum.workspace = true
base64.workspace = true
futures-util.workspace = true
image.workspace = true
md5.workspace = true
reqwest.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
tracing.workspace = true
utoipa.workspace = true
uuid.workspace = true

[features]
# Fakes, memory stores and test constructors for the test suites above.
test-support = [
    "droppedneedle-kernel/test-support",
    "droppedneedle-providers/test-support",
    "droppedneedle-auth/test-support",
    "droppedneedle-library/test-support",
    "droppedneedle-media/test-support",
]

[dev-dependencies]
droppedneedle-auth = { workspace = true, features = ["test-support"] }
droppedneedle-kernel = { workspace = true, features = ["test-support"] }
