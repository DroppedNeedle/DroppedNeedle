[workspace]
resolver = "2"
members = [".", "auth", "kernel", "providers", "testkit"]

[workspace.package]
version = "3.0.0"
edition = "2024"
rust-version = "1.89"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
droppedneedle-auth = { path = "auth", version = "3.0.0" }
droppedneedle-kernel = { path = "kernel", version = "3.0.0" }
droppedneedle-providers = { path = "providers", version = "3.0.0" }
argon2 = { version = "0.5", features = ["alloc"] }
axum = { version = "0.8", features = ["json", "query", "http1", "matched-path", "multipart"] }
base64 = "0.22"
bcrypt = "0.17"
caseless = "0.2"
chacha20poly1305 = "0.10"
flate2 = "1"
futures-util = "0.3"
getrandom = "0.3"
libc = "0.2"
lofty = "0.25"
md5 = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
ring = "0.17"
sha1 = "0.10"
rubato = "0.16"
rusqlite = { version = "0.32", features = ["bundled", "backup", "functions", "hooks"] }
rusty-chromaprint = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = "0.6"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio", "macros", "migrate"] }
symphonia = { version = "0.6", features = ["aac", "alac", "isomp4", "mp3"] }
symphonia-adapter-libopus = "0.3"
thiserror = "2"
unicode-normalization = "0.1"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "compression-br", "compression-gzip"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
utoipa = "5"
uuid = { version = "1", features = ["v4"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
hmac = "0.12"
toml = "1"
time = { version = "0.3", default-features = false, features = ["std", "formatting"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
# Tokenises Newznab indexer responses, which are untrusted XML. MIT, one
# dependency (memchr, already in the tree). No features: it never touches
# the network, never reads a DTD and expands no declared entities.
quick-xml = { version = "0.42", default-features = false }
# Unicode script classes for Picard's "is this name in Latin script" test
# when translating artist names. Already in the tree under tracing's
# env-filter (regex-automata, regex-syntax).
regex = "1.13.1"

[package]
name = "droppedneedle"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "DroppedNeedle v3 backend"
license.workspace = true

[dependencies]
droppedneedle-auth.workspace = true
droppedneedle-kernel.workspace = true
droppedneedle-providers.workspace = true
argon2.workspace = true
axum.workspace = true
base64.workspace = true
bcrypt.workspace = true
caseless.workspace = true
chacha20poly1305.workspace = true
flate2.workspace = true
futures-util.workspace = true
getrandom.workspace = true
libc.workspace = true
lofty.workspace = true
md5.workspace = true
reqwest.workspace = true
ring.workspace = true
sha1.workspace = true
rubato.workspace = true
rusqlite.workspace = true
rusty-chromaprint.workspace = true
serde.workspace = true
serde_json.workspace = true
socket2.workspace = true
sha2.workspace = true
sqlx.workspace = true
symphonia.workspace = true
symphonia-adapter-libopus.workspace = true
thiserror.workspace = true
unicode-normalization.workspace = true
tokio.workspace = true
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
utoipa.workspace = true
uuid.workspace = true
zip.workspace = true
aes.workspace = true
cbc.workspace = true
hmac.workspace = true
toml.workspace = true
time.workspace = true
image.workspace = true
quick-xml.workspace = true
regex.workspace = true

[features]
# Fakes, mocks, memory stores and test constructors for the test suite.
test-support = [
    "droppedneedle-kernel/test-support",
    "droppedneedle-providers/test-support",
    "droppedneedle-auth/test-support",
]

[dev-dependencies]
droppedneedle = { path = ".", features = ["test-support"] }
droppedneedle-testkit = { path = "testkit", version = "0.1.0" }
tokio = { version = "1", features = ["test-util"] }

# Debug builds carry line tables for this crate and no debug info for
# dependencies. Full debug info nearly doubled the time of a clean test
# build and made the test binary over 1 GB. Panics and backtraces still
# give file and line for this crate; a debugger sees no local variables,
# and dependency frames show function names only. Release builds are
# untouched.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Debug builds (tests, clippy, local runs) optimize the few dependencies
# whose unoptimized code dominated the test suite: the Argon2id/bcrypt
# password hashes at their real production parameters, and bundled SQLite,
# which the build script compiles at -O0 otherwise. Release builds are
# untouched.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.dev.package.bcrypt]
opt-level = 3

[profile.dev.package.blowfish]
opt-level = 3

[profile.dev.package.libsqlite3-sys]
opt-level = 3
