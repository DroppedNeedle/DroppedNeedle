[workspace]
resolver = "2"
members = ["."]

[package]
name = "droppedneedle"
version = "3.0.0"
edition = "2024"
rust-version = "1.89"
description = "DroppedNeedle v3 backend"
license = "AGPL-3.0-or-later"

[dependencies]
argon2 = { version = "0.5", features = ["alloc"] }
axum = { version = "0.8", features = ["json", "query", "http1", "matched-path"] }
base64 = "0.22"
bcrypt = "0.17"
caseless = "0.2"
chacha20poly1305 = "0.10"
flate2 = "1"
futures-util = "0.3"
getrandom = "0.3"
libc = "0.2"
lofty = "0.25"
md5 = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
sha1 = "0.10"
rubato = "0.16"
rusqlite = { version = "0.32", features = ["bundled", "backup", "functions"] }
rusty-chromaprint = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio", "macros", "migrate"] }
symphonia = { version = "0.6", features = ["aac", "alac", "isomp4", "mp3"] }
symphonia-adapter-libopus = "0.3"
thiserror = "2"
unicode-normalization = "0.1"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
utoipa = "5"
uuid = { version = "1", features = ["v4"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
hmac = "0.12"
toml = "1"
time = { version = "0.3", default-features = false, features = ["std", "formatting"] }

[features]
# Fakes, mocks, memory stores and test constructors for the test suite.
test-support = []

[dev-dependencies]
droppedneedle = { path = ".", features = ["test-support"] }
regex = "1.13.1"
tokio = { version = "1", features = ["test-util"] }
