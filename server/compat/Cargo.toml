[package]
name = "droppedneedle-compat"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "DroppedNeedle Subsonic and Jellyfin compatibility APIs"
publish = false

[dependencies]
droppedneedle-auth.workspace = true
droppedneedle-catalog.workspace = true
droppedneedle-kernel.workspace = true
droppedneedle-library.workspace = true
droppedneedle-media.workspace = true
droppedneedle-providers.workspace = true
axum.workspace = true
base64.workspace = true
futures-util.workspace = true
image.workspace = true
quick-xml.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
sha2.workspace = true
sqlx.workspace = true
time.workspace = true
tokio.workspace = true
tower.workspace = true
tracing.workspace = true
uuid.workspace = true

[features]
# The schema test's statement list, and the lower crates' test helpers,
# for the test suites above.
test-support = [
    "droppedneedle-kernel/test-support",
    "droppedneedle-providers/test-support",
    "droppedneedle-auth/test-support",
    "droppedneedle-library/test-support",
    "droppedneedle-media/test-support",
    "droppedneedle-catalog/test-support",
]

[dev-dependencies]
droppedneedle-media = { workspace = true, features = ["test-support"] }
