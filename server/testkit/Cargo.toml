[package]
name = "droppedneedle-testkit"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Loopback mock servers for the DroppedNeedle test suite"
license = "AGPL-3.0-or-later"
publish = false

[dependencies]
axum = { version = "0.8", features = ["json", "query", "http1"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
tokio = { version = "1", features = ["macros", "net", "rt", "signal", "time"] }
uuid = { version = "1", features = ["v4"] }
