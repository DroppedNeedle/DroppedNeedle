# cargo-deny policy for the v3 backend (cargo-deny 0.20 schema: checks deny
# by default, no lint levels). CI runs `cargo deny check`, which covers
# advisories, licenses, bans, and sources from this one file.
[graph]
targets = ["x86_64-unknown-linux-gnu"]

[advisories]
# RUSTSEC-2024-0436: `paste` unmaintained, via lofty (tag reading and writing)
# and utoipa-axum 0.2 (route registration). Build-time proc-macro only, no
# runtime exposure; the advisory lists no safe upgrade (pastey is not a
# drop-in for lofty's use, and utoipa-axum 0.3, which uses pastey, needs
# utoipa 6). Re-check on lofty or utoipa upgrades.
ignore = ["RUSTSEC-2024-0436"]

[licenses]
# Copyleft applies to our own crate only; every dependency must be permissive
# or a data license, except the reviewed weak-copyleft carve-out below.
# The graph is scoped to the Linux target below, so target-gated crates
# (wasi, r-efi) never appear here. A new target or a license outside this
# list fails the check until it is reviewed and added deliberately.
# MPL-2.0 (reviewed): the symphonia 0.6 family (audio decode
# for tag probing) is file-scoped weak copyleft. The server links it
# unmodified over crates.io; no MPL-covered file is modified, so no
# source-disclosure obligation triggers. Re-check if symphonia is forked,
# patched, or statically distributed outside this container.
allow = [
  "AGPL-3.0-or-later",
  "Apache-2.0",
  "BSD-3-Clause",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
